    <div>
        <a th:href="@{/home}" class="barra-marca">
            <img th:src="@{/img/LOGO.png}" alt="logo-Citas" class="barra-logo">
            <span>
                Agenda Fácil
            </span>
        </a>
    </div>
    <nav class="barra-nav">
        <a th:href="@{/home}" class="barra-nav">
            Agenda
        </a>
        <!--Agregar enlaces a las paginas-->
        <a>

        </a>

            Doctores

        <a href="#"> Cerrar sesión</a>

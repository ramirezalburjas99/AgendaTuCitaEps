<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedes Registradas</title>

    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>

<header class="app-header">
    <div class="app-container" style="padding-top:1.5rem; padding-bottom:1.5rem;">
        <h1 class="app-header-title">Gestión de Sedes</h1>
        <p class="app-header-description">Listado de sedes registradas en el sistema.</p>
    </div>
</header>

<main class="app-container">

    <div th:if="${success}" class="alert alert-success">
        <p th:text="${success}"></p>
    </div>

    <div class="card">
        <div class="card-header" style="display:flex; align-items:center; justify-content:space-between;">
            <h2 class="section-title">Sedes registradas</h2>
            <a href="/view/sede/form" class="btn btn-primary">
                Registrar Sede
            </a>
        </div>

        <div class="table-container">
            <table class="app-table">
                <thead>
                <tr>
                    <th>Acciones</th>
                    <th>ID Sede</th>
                    <th>Dirección</th>
                    <th>Teléfono</th>
                </tr>
                </thead>
                <tbody>

                <tr th:each="sedeItem : ${sede}">

                    <td>
                        <div class="table-actions">
                            <a th:href="@{'/view/sede/update/' + ${sedeItem.idSede}}"
                               class="btn btn-sm btn-secondary">
                                ✏️ Editar
                            </a>

                            <form th:action="@{'/view/sede/delete/' + ${sedeItem.idSede}}" method="post">
                                <button type="submit" class="btn btn-sm btn-danger">
                                    🗑️ Eliminar
                                </button>
                            </form>
                        </div>
                    </td>

                    <td th:text="${sedeItem.idSede}"></td>
                    <td th:text="${sedeItem.direccionSede}"></td>
                    <td th:text="${sedeItem.telefono}"></td>
                </tr>

                </tbody>
            </table>
        </div>

        <!-- Si no existen sedes -->
        <div th:if="${sede == null or #lists.isEmpty(sede)}" class="empty-state">
            <div class="empty-state-icon">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                     stroke-width="1.5" stroke="currentColor" style="width:2rem;height:2rem;">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.205-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197A5.971 5.971 0 0 0 6 18.719M15.75 6.75a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-15 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z"/>
                </svg>
            </div>
            <h3 class="empty-state-title">No hay sedes registradas</h3>
            <p class="empty-state-description">Registra la primera sede para comenzar a administrar el sistema.</p>
            <a th:href="@{/view/sede/form}" class="btn btn-primary" style="margin-top:1.25rem;">
                Registrar la primera sede
            </a>
        </div>

    </div>
</main>

</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title th:text="${sede.idSede == null}
        ? 'Registrar Sede'
        : 'Editar Sede'">
        Formulario Sede
    </title>

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

<header class="app-header">
    <div class="app-container" style="padding-top:1.5rem; padding-bottom:1.5rem; display:flex; align-items:center; justify-content:space-between;">
        <div>
            <h1 class="app-header-title"
                th:text="${sede.idSede == null}
                    ? 'Registrar Sede'
                    : 'Editar Sede'">
                Formulario sede
            </h1>
            <p class="app-header-description"
               th:text="${sede.idSede == null}
                    ? 'Complete la información para registrar una nueva sede.'
                    : 'Actualice la información de la sede seleccionada.'">
                Complete la información de la sede.
            </p>
        </div>

        <span class="badge badge-primary"
              th:text="${sede.idSede == null} ? 'Nuevo registro' : 'Modificación'">
            Gestión de Sedes
        </span>
    </div>
</header>

<main class="app-container" style="max-width: 600px;">

    <div class="card">

        <div class="card-header">
            <h2 class="section-title">Información de la sede</h2>
            <p class="description">
                Los campos marcados con <span class="required">*</span> son obligatorios.
            </p>
        </div>

        <form th:action="@{/view/sede/save}"
              th:object="${sede}"
              method="post">

            <div class="card-body">

                <!-- Campo oculto para el ID -->
                <input type="hidden" th:field="*{idSede}">

                <!-- Dirección -->
                <div class="form-group">
                    <label for="direccionSede" class="form-label">
                        Dirección <span class="required">*</span>
                    </label>
                    <input type="text" id="direccionSede" th:field="*{direccionSede}"
                           class="form-control" required>
                </div>

                <!-- Teléfono -->
                <div class="form-group">
                    <label for="telefono" class="form-label">
                        Teléfono <span class="required">*</span>
                    </label>
                    <input type="number" id="telefono" th:field="*{telefono}"
                           class="form-control" required>
                </div>

            </div>

            <div class="card-footer" style="display:flex; gap:0.75rem; justify-content:flex-end;">
                <a th:href="@{/view/sede}" class="btn btn-secondary">Volver</a>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>

        </form>
    </div>

</main>
</body>
</html>

<header class="barra-superior"
        th:fragment="barraSuperior"
        xmlns:th="https://www.thymeleaf.org">

    <a th:href="@{/home}" class="barra-marca">
        <img th:src="@{/img/LOGO.png}" alt="logo Agenda Fácil" class="barra-logo">
        <span>
            Agenda Fácil
        </span>
    </a>

    <nav class="barra-nav">
        <a th:href="@{/home}" class="activo">Agenda</a>
        <!--Agregar enlaces a las paginas-->
        <a href="#">Mis citas</a>
        <a href="#">Doctores</a>
        <a href="#">Acerca</a>
    </nav>

    <div class="barra-usuario">
        <span class="barra-avatar" th:text="${#strings.substring(pacientes.nombreCompleto, 0, 1)}">P</span>
        <span class="barra-nombre" th:text="${pacientes.nombreCompleto}">Paciente</span>
        <a th:href="@{/inicio}" class="barra-salir">Cerrar sesión</a>
    </div>
</header>

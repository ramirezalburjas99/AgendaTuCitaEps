<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">

    <title>Inicio de Sesión</title>
<!--enlace que referencia a CSS-->
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body>
<!-- El encabezado para el inicio de sesión-->
    <div class="login-container">
        <div class = "card">
            <div class="card-header" style="text-align: center;">
                <img th:src="@{/img/LOGO.png}" alt="logo-Citas" style="max-width: 120px; margin-bottom: 1rem;">
                <h1 class="page-title">Agenda Fácil</h1>
                <p class="description">Organiza tus citas sin complicaciones</p>
            </div>
<!--Formulario de inición de Sesión-->
            <div class="card-body">
                <form method="POST" th:action="@{/login}">
<!--Campo correo-->
                    <div class="form-group">
                        <label class="form-label" for="email">Correo Electrónico <span class="required">*</span></label>
                        <input type="email" id="email" name="correo" class="form-control" placeholder="Jose@gmail.com" required>
                    </div>
<!--Campo contraseña-->
                    <div class="form-group">
                        <label class="form-label" for="password">Contraseña <span class="required">*</span></label>
                        <input type="password" id="password" name="contrasena" class="form-control" placeholder="********">
                    </div>
                <button type="Submit" class="btn btn-primary" style="width: 100%;">
                Iniciar Sesión
                </button>
                 </form>
            </div>
        </div>
    </div>
</body>
</html>
